<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>صيد الفئران</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:linear-gradient(#5b8c3a,#2f5a1e);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#fff;touch-action:manipulation;overflow:hidden}
#hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:20px;font-weight:800;text-shadow:0 2px 4px #0008}
#bar{height:8px;margin:0 16px;background:#0004;border-radius:6px;overflow:hidden}#bf{height:100%;width:100%;background:#ffd166}
#msg{text-align:center;height:30px;margin-top:6px;font-weight:800;font-size:18px;color:#fff3b0}
#grid{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92vw,52vh,400px)}
.h{aspect-ratio:1;background:radial-gradient(#3b2410 55%,#6b4423 56%);border-radius:50%;position:relative;overflow:hidden;border:4px solid #4a2f17}
.m{position:absolute;left:0;right:0;bottom:-100%;text-align:center;font-size:min(14vw,9vh);transition:bottom .1s;line-height:1.1}
.h.up .m{bottom:8%}
.ov{position:fixed;inset:0;background:rgba(20,40,10,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:5}
.hide{display:none}.ov p{margin:0;line-height:1.7;max-width:320px}.ov h1{margin:0;font-size:36px;color:#ffd166}
.bt{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:14px;padding:12px 30px;color:#fff;background:linear-gradient(135deg,#e8871e,#b5451b)}
#snd{font:inherit;font-size:14px;border:0;border-radius:10px;padding:4px 10px;background:#0003;color:#fff}
</style></head><body>
<div id="hud"><span id="sc">0</span><span id="cb"></span><span id="tm">30</span><button id="snd">🔊</button></div>
<div id="bar"><div id="bf"></div></div><div id="msg"></div>
<div id="grid"></div>
<div class="ov" id="menu"><h1>صيد الفئران 🐀</h1><p>اضرب الفار 🐀 قبل ما يستخبى! الفار الدهبي 🐭 بـ 5 نقط ووقت زيادة. القنبلة 💣 لا! بتخسّرك وقت ونقط.</p><p>اضرب بسرعة ورا بعض عشان الكومبو يكبر 🔥</p><p id="bst"></p><button class="bt" id="go">ابدأ</button></div>
<div class="ov hide" id="over"><h1>الوقت خلص!</h1><p id="res"></p><button class="bt" id="again">تاني</button></div>
<script>
const SV='rat_hunt_v1';let sv={best:0,snd:1};try{Object.assign(sv,JSON.parse(localStorage.getItem(SV)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(SV,JSON.stringify(sv))}catch(e){}}
let AC=null;function beep(f,d,t,v){if(!sv.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.value=f;a.gain.value=v||.08;a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const G=document.getElementById('grid');const cells=[];
for(let i=0;i<9;i++){const h=document.createElement('div');h.className='h';h.innerHTML='<div class="m"></div>';G.appendChild(h);h.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)});cells.push({el:h,m:h.firstChild,k:null,t:0})}
let score,time,combo,running=false,hits,miss,spawnT,msgT,last=0,maxCombo,total=30;
const E={r:'🐀',g:'🐭',b:'💣'};
function newGame(){score=0;time=total;combo=0;hits=0;miss=0;spawnT=0;maxCombo=0;for(const c of cells){c.k=null;c.el.classList.remove('up')}running=true;document.getElementById('menu').classList.add('hide');document.getElementById('over').classList.add('hide');upd();say('يلا! 🔨')}
function say(t){document.getElementById('msg').textContent=t;msgT=1.2}
function upd(){document.getElementById('sc').textContent='⭐ '+score;document.getElementById('tm').textContent='⏱️ '+Math.ceil(time);document.getElementById('cb').textContent=combo>=3?'🔥 x'+Math.min(1+Math.floor(combo/3),5):'';document.getElementById('bf').style.width=(time/total*100)+'%'}
function up(i,k,dur){const c=cells[i];c.k=k;c.t=dur;c.m.textContent=E[k];c.el.classList.add('up')}
function down(i,missed){const c=cells[i];if(c.k&&missed&&c.k!=='b'){combo=0;miss++}c.k=null;c.el.classList.remove('up')}
function hit(i){if(!running)return;const c=cells[i];if(!c.k)return;const k=c.k;const mult=Math.min(1+Math.floor(combo/3),5);
 if(k==='b'){score=Math.max(0,score-8);time=Math.max(0,time-2);combo=0;beep(100,.3,'sawtooth');say('💣 بوم! -2 ثانية')}
 else if(k==='g'){score+=5*mult;time=Math.min(total+10,time+1.5);combo++;hits++;beep(1000,.12,'triangle');say('🐭 دهبي! +1.5ث')}
 else{score+=1*mult;combo++;hits++;beep(300+Math.min(combo,20)*18,.07,'square',.05)}
 maxCombo=Math.max(maxCombo,combo);c.k=null;c.el.classList.remove('up');upd()}
function step(dt){if(msgT>0){msgT-=dt;if(msgT<=0)document.getElementById('msg').textContent=''}if(!running)return;time-=dt;
 const el=total-time;const rate=Math.max(.32,.85-el*.014);spawnT-=dt;
 for(let i=0;i<9;i++){const c=cells[i];if(c.k){c.t-=dt;if(c.t<=0)down(i,true)}}
 if(spawnT<=0){spawnT=rate*(.6+Math.random()*.6);const free=cells.map((c,i)=>c.k?-1:i).filter(i=>i>=0);if(free.length){const i=free[Math.floor(Math.random()*free.length)];const r=Math.random();const pb=Math.min(.22,.06+el*.006);const k=r<pb?'b':r<pb+.1?'g':'r';up(i,k,Math.max(.55,1.3-el*.02))}}
 upd();if(time<=0){running=false;end()}}
function end(){for(let i=0;i<9;i++)down(i,false);const nb=score>sv.best;if(nb){sv.best=score;persist()}beep(200,.4,'sawtooth');document.getElementById('res').innerHTML='نتيجتك ⭐ '+score+'<br>ضربت '+hits+' · فاتك '+miss+'<br>أعلى كومبو '+maxCombo+(nb?'<br>🏆 رقم قياسي جديد!':'<br>أعلى رقم: '+sv.best);setTimeout(()=>document.getElementById('over').classList.remove('hide'),500)}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;step(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('go').onclick=newGame;document.getElementById('again').onclick=newGame;
document.getElementById('snd').onclick=function(){sv.snd=sv.snd?0:1;persist();this.textContent=sv.snd?'🔊':'🔇'};document.getElementById('snd').textContent=sv.snd?'🔊':'🔇';
document.getElementById('bst').textContent=sv.best?'🏆 أعلى رقم: '+sv.best:'';
window.__t={newGame,step,hit,st:()=>({score,time,combo,running,hits,miss,k:cells.map(c=>c.k)})};
</script></body></html>
